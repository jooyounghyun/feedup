<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FeedUp PT">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>FeedUp PT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0B0C;--muted:#5B616E;--soft:#F2F4F7;--line:#E4E7EC;--line2:#EEF0F3;--acc:#1E5EFF;--acc2:#EEF3FF;--good:#12803F;--bad:#D4381C;--warn:#A0410A;--warn2:#FFF1E8;--paper:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;background:#E9ECF0}
body{font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea{font:inherit;color:inherit}
.num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.preview{background:var(--ink);color:#fff;font-size:12px;font-weight:700;text-align:center;padding:6px 12px}
.preview a{color:#9DB8FF}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:8px}
.logo{font-size:21px;font-weight:900;letter-spacing:-.04em}
.chip{font-size:11px;font-weight:800;background:var(--acc);color:#fff;border-radius:5px;padding:2px 7px;margin-left:6px;vertical-align:3px}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.ibtn{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:4px;background:var(--bad)}
main{padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px}
h2{font-size:15px;font-weight:800;margin:10px 0 0;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:12px;color:var(--muted);font-weight:700}
.hero{display:flex;justify-content:space-between;align-items:flex-end}
.big{font-size:54px;font-weight:800;line-height:.95;letter-spacing:-.02em}
.sub{font-size:13.5px;color:var(--muted);margin-top:4px}
.bar8{display:flex;gap:4px}.bar8 i{flex:1;height:5px;border-radius:3px;background:var(--line)}.bar8 i.on{background:var(--acc)}
.card{border:1px solid var(--line);border-radius:14px;background:#fff}
.card.pad{padding:12px 14px}
.card.ink{border:1.5px solid var(--ink)}
.grp{overflow:hidden}
.grp .gh{display:flex;justify-content:space-between;padding:10px 14px;background:#F7F8FA;font-size:13px;font-weight:800}
.grp .gh span:last-child{color:var(--muted);font-weight:700;font-size:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line2);width:100%;text-align:left}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid #C9CDD4;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ck.on{background:var(--ink);border-color:var(--ink)}
.ck svg{display:none}.ck.on svg{display:block}
.nm{font-size:15px;font-weight:700}.ds{font-size:12px;color:var(--muted);margin-top:1px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:14px;background:var(--ink);color:#fff;font-size:16px;font-weight:800}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--bad)}
.btn[disabled]{opacity:.45}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.red.on{background:var(--bad);border-color:var(--bad)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;display:block}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--soft);border-radius:12px;padding:10px 12px}
.tile .k{font-size:11.5px;font-weight:700;color:var(--muted)}
.tile .v{font-size:20px;font-weight:800;margin-top:2px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .k{font-size:11.5px;font-weight:700;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:800;margin-top:2px;line-height:1}
.kpi .d{font-size:12px;font-weight:800;margin-top:4px}
.good{color:var(--good)}.bad{color:var(--bad)}.mut{color:var(--muted)}
textarea,.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;resize:none;background:#fff;outline:none}
textarea:focus,.inp:focus{border-color:var(--ink)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;pointer-events:none}
.tabbar nav{pointer-events:auto;width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:700;color:#8E929B;position:relative}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::before{content:'';position:absolute;top:0;width:24px;height:3px;border-radius:2px;background:var(--ink)}
.tabbar .cnt{position:absolute;top:8px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
.ov{position:fixed;inset:0;z-index:20;background:#E9ECF0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov .in{max-width:480px;margin:0 auto;min-height:100%;background:#fff;display:flex;flex-direction:column}
.ebar{position:sticky;top:0;z-index:2;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2)}
.ebar .t{font-size:16px;font-weight:800}
.ebar button{font-size:15px;font-weight:700;padding:8px 0;min-width:44px}
.ebar .go{color:var(--acc);font-weight:800;text-align:right}
.ov main{flex:1}
.foot{padding:10px 16px calc(18px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:#fff}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:700;z-index:50;max-width:88vw;text-align:center}
.settbl .h,.settbl .r{display:grid;grid-template-columns:44px 1fr 1fr 52px;align-items:center;gap:6px;padding:8px 14px}
.settbl .h{background:#F7F8FA;font-size:12px;font-weight:700;color:var(--muted)}
.settbl .r{border-top:1px solid var(--line2)}
.settbl .r.cur{background:var(--acc2)}
.settbl input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 8px;font-size:15px;font-weight:700;text-align:center;background:#fff}
.timer{background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.timer .s{font-size:12px;color:#B9BDC6;font-weight:700}
.timer .v{font-size:34px;font-weight:800;line-height:1}
.timer button{border:1px solid #3A3D44;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;color:#fff}
.timer button.w{background:#fff;color:var(--ink);border:0}
.exc{border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;position:relative;background:#fff;display:block;width:100%}
.exc.on{border:2px solid var(--ink)}
.exc .fig{height:96px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.exc .ttl{padding:9px 11px 11px}
.exc .ttl b{display:block;font-size:14.5px;font-weight:800}
.exc .ttl span{font-size:11.5px;color:var(--muted)}
.exc .cb{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:13px;background:#fff;border:2px solid #C9CDD4;display:flex;align-items:center;justify-content:center}
.exc.on .cb{background:var(--ink);border-color:var(--ink)}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.scroller::-webkit-scrollbar{display:none}
.scroller .pill{flex-shrink:0;border:0;background:var(--soft)}
.scroller .pill.on{background:var(--ink)}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:var(--soft);padding:0 14px}
.search input{flex:1;border:0;background:transparent;font-size:15px;outline:none;min-width:0}
.mbar{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:8px;margin-bottom:7px;font-size:13px;font-weight:700}
.mbar .tr{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}.mbar .tr i{display:block;height:100%;border-radius:4px}
.cmp{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#E4E7EC;--x:50%}
.cmp .lay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.cmp .before{background:#C7CBD2;clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.cmp .line{position:absolute;top:0;bottom:0;left:var(--x);width:3px;margin-left:-1.5px;background:#fff;pointer-events:none}
.cmp .tag{position:absolute;top:12px;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:800;color:#fff}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.knob{position:absolute;top:50%;left:var(--x);width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:22px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;pointer-events:none}
.sw{width:46px;height:28px;border-radius:14px;background:#C9CDD4;position:relative;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.sw.on{background:var(--acc)}.sw.on::after{left:21px}
.lvl{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.lvl button{height:38px;border-radius:8px;background:var(--soft);font-size:13px;font-weight:800;color:var(--muted)}
.lvl button.f{background:#FFC9A8;color:#3A1405}.lvl button.f2{background:#F28A5C;color:#3A1405}.lvl button.on{background:var(--bad);color:#fff}
.badge{font-size:11.5px;font-weight:800;border-radius:6px;padding:3px 8px;display:inline-block}
.b-blue{background:var(--acc2);color:#1E3FB0}.b-warn{background:var(--warn2);color:var(--warn)}.b-gray{background:var(--soft);color:var(--muted)}.b-red{background:#FDE8E4;color:#A3260F}
.ntf{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.ntf .ic{width:38px;height:38px;flex-shrink:0;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:900}
.slot{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:stretch}
.slot .t{font-size:13px;font-weight:700;color:var(--muted);padding-top:12px}
.slot .b{border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days button{border-radius:12px;padding:8px 0;background:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px}
.days button.on{background:var(--ink);color:#fff}
.days .w{font-size:11px;font-weight:700;opacity:.75}.days .n{font-size:20px;font-weight:800}.days .c{font-size:10.5px;font-weight:800}
.trend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;height:120px;align-items:end;margin-top:12px}
.trend>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.trend .bs{display:flex;gap:4px;align-items:flex-end;height:96px}
.trend i{width:16px;border-radius:4px 4px 0 0}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px}
.lnk{color:var(--acc);font-weight:700;font-size:13px}
@media (min-width:520px){#app,.ov .in{box-shadow:0 0 0 1px var(--line)}}

.onb{padding:40px 22px 40px;display:flex;flex-direction:column;min-height:100vh}
.big-in{height:52px;font-size:16px}
.agwrap{margin-top:22px;border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.agrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.agck{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px;font-weight:600;text-align:left;flex:1}
.agck.agall{font-weight:800;border-bottom:1px solid var(--line2);width:100%}
.agbox{width:22px;height:22px;border-radius:6px;border:2px solid #C9CDD4;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.agbox svg{display:none}.agck.on .agbox{background:var(--ink);border-color:var(--ink)}.agck.on .agbox svg{display:block}
.agview{font-size:12.5px;color:var(--muted);text-decoration:underline}
.agage{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 8px}
.agage button{border:1.5px solid var(--line);border-radius:10px;padding:10px 0;font-size:13.5px;font-weight:700}
.agage button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.agg{padding:6px 0 10px}.agg p{font-size:13px;color:var(--muted);margin:0 0 8px}
.sportsw{margin-left:8px;height:26px;padding:0 9px;border-radius:999px;border:1.5px solid var(--line);font-size:11.5px;font-weight:800;background:#fff;white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mitem{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--soft)}
.mthumb{display:block;width:100%;height:100%;position:relative}
.mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover;display:block}
.mthumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18)}
.mdel{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:14px;background:rgba(11,11,12,.72);color:#fff;font-size:18px;line-height:1}
.madd{border:1.5px dashed #C9CDD4;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.madd b{font-size:24px;font-weight:500;line-height:1}.madd input{display:none}
.mup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:6px;background:rgba(242,244,247,.9)}
.mcap{position:absolute;left:6px;bottom:6px;background:rgba(11,11,12,.7);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.btile{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.btile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.btile .bl{position:absolute;left:6px;bottom:6px;background:rgba(11,11,12,.72);color:#fff;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:700}
.bshot{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;color:#B9BDC6}
.bshot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.bshot img.ghost{opacity:.35}
.bph2 svg{width:64px;height:64px}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .before{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.viewer{min-height:100vh;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
.viewer img,.viewer video{max-width:100%;max-height:100vh;display:block}
.vclose{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.18);color:#fff;font-size:26px;z-index:2}
.pill[disabled],.btn[disabled],.ibtn[disabled]{opacity:.4;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const A='#1E5EFF';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
const IC={
  bell:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B616E" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  person:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="7" r="3"/><path d="M6 21v-5a6 6 0 0 1 12 0v5"/></svg>',
  arrows:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="2.5" aria-hidden="true"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg>'
};
/* ---------- 운동 그림 (선 그림, 120x90) ---------- */
const G='#C9CDD4';
const svg=(inner,w,h)=>'<svg width="'+(w||120)+'" height="'+(h||90)+'" viewBox="0 0 120 90" fill="none" stroke="#0B0B0C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>';
const floor='<path d="M8 84H112" stroke="'+G+'" stroke-width="2"/>';
const head=(x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="6" fill="#0B0B0C" stroke="none"/>';
const FIG={
  squat:floor+'<path d="M30 31H88" stroke="'+A+'" stroke-width="3"/><rect x="26" y="22" width="6" height="18" rx="2" fill="'+A+'" stroke="none"/><rect x="86" y="22" width="6" height="18" rx="2" fill="'+A+'" stroke="none"/>'+head(54,21)+'<path d="M58 32L72 56"/><path d="M72 56L50 58L54 83"/><path d="M58 32L48 31"/><path d="M58 32L68 31"/>',
  squatTop:floor+'<path d="M32 22H88" stroke="'+A+'" stroke-width="3"/><rect x="28" y="13" width="6" height="18" rx="2" fill="'+A+'" stroke="none"/><rect x="86" y="13" width="6" height="18" rx="2" fill="'+A+'" stroke="none"/>'+head(60,11)+'<path d="M60 19V52"/><path d="M60 52L56 68L56 83"/><path d="M60 52L64 68L64 83"/><path d="M60 22L50 22"/><path d="M60 22L70 22"/>',
  rdl:floor+head(36,38)+'<path d="M44 43L72 50"/><path d="M72 50L64 66L64 83"/><path d="M46 44L48 66"/><path d="M28 67H70" stroke="'+A+'" stroke-width="3"/><circle cx="28" cy="67" r="8" fill="'+A+'" stroke="none"/><circle cx="70" cy="67" r="8" fill="'+A+'" stroke="none" opacity=".35"/>',

/* ---------- 인바디 ---------- */
const diffH=(a,b,dec,lowerGood)=>{if(a==null||b==null||a===''||b==='')return '';const d=+(a-b).toFixed(dec);if(!d)return '<span class="mut">변화 없음</span>';const good=lowerGood?d<0:d>0;return '<span class="'+(good?'good':'bad')+'">'+(d>0?'▲ ':'▼ ')+Math.abs(d).toFixed(dec)+'</span>';};
function inbodyBlock(m,canAdd){
  const L=inbodyOf(m);
  let h='';
  if(!L.length)return '<div class="empty">아직 인바디 기록이 없어요.<br>결과지를 보고 숫자만 넣으면 변화가 그래프로 보여요.</div>'+(canAdd?'<button class="btn" data-a="open" data-v="addInbody" data-i="'+m+'">+ 인바디 기록</button>':'');
  const c=L[L.length-1],p=L[L.length-2]||null,f=L[0];
  if(L.length>1)h+='<div style="font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1.35">처음('+md(f.date)+')보다 근육 '+((c.m-f.m)>=0?'+':'')+(c.m-f.m).toFixed(1)+'kg,<br>체지방 '+((c.f-f.f)>=0?'+':'')+(c.f-f.f).toFixed(1)+'%p</div>';
  h+='<div class="ds" style="margin:0;font-weight:700">최근 측정 '+md(c.date)+' · '+L.length+'번째</div>';

const mediaUrl=k=>'/api/media/'+k.split('/').map(encodeURIComponent).join('/');
function videoDuration(file){
  return new Promise(res=>{
    const v=document.createElement('video'),u=URL.createObjectURL(file);let done=false;
    v.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0';
    const fin=d=>{if(done)return;done=true;try{v.remove();}catch(e){}URL.revokeObjectURL(u);res(d);};
    const check=()=>{if(isFinite(v.duration)&&v.duration>0)fin(v.duration);};
    v.preload='metadata';v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');
    v.addEventListener('loadedmetadata',check);v.addEventListener('durationchange',check);v.addEventListener('canplay',check);
    v.onerror=()=>fin(null);setTimeout(()=>fin(null),12000);
    document.body.appendChild(v);v.src=u;try{v.load();}catch(e){}
  });
}
function shrinkImage(file){
  return new Promise(res=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const M=1600,sc=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(b=>res(b||file),'image/jpeg',0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);res(file);};
    img.src=u;
  });
}

function uploadBlob(url,blob,type,onp){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    x.open('POST',url);x.withCredentials=true;x.timeout=180000;x.setRequestHeader('content-type',type);
    x.upload.onprogress=e=>{if(e.lengthComputable&&onp)onp(e.loaded/e.total);};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText);}catch(e){}
      if(x.status>=200&&x.status<300)res(j);else{const er=new Error((j.error||'올리지 못했어요.')+' (오류 '+x.status+')');er.http=x.status;rej(er);}};
    x.onerror=x.ontimeout=()=>rej(new Error('인터넷 연결이 불안정해서 올리지 못했어요. 와이파이에서 다시 시도해 주세요.'));
    x.send(blob);
  });

            const z=AC.createGain();z.gain.value=0;srcNode.connect(z);z.connect(AC.destination);

// 소리를 지키려고 원본을 올릴 때: 20MB씩 나눠 올려요(최대 400MB)
function putChunk(url,blob,onp){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();x.open('PUT',url);x.withCredentials=true;x.timeout=180000;x.setRequestHeader('content-type','application/octet-stream');
    x.upload.onprogress=e=>{if(e.lengthComputable&&onp)onp(e.loaded/e.total);};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText);}catch(e){}if(x.status>=200&&x.status<300)res(j);else{const er=new Error(j.error||('올리지 못했어요 (오류 '+x.status+')'));er.http=x.status;rej(er);}};
    x.onerror=x.ontimeout=()=>rej(new Error('인터넷 연결이 불안정해서 올리지 못했어요. 와이파이에서 다시 시도해 주세요.'));
    x.send(blob);

}
async function uploadBig(file,type,info,say){
  const st=await API.req('/upload/start',{method:'POST',body:Object.assign({type,size:file.size},info)});
  const P=st.partSize,n=Math.ceil(file.size/P),parts=[];
  try{
    for(let i=0;i<n;i++){
      const chunk=file.slice(i*P,Math.min(file.size,(i+1)*P));let r=null;
      for(let t=0;t<3&&!r;t++){
        try{r=await putChunk('/api/upload/part?key='+encodeURIComponent(st.key)+'&uploadId='+encodeURIComponent(st.uploadId)+'&n='+(i+1),chunk,p=>say('원본 올리는 중 '+Math.round((i+p)/n*100)+'%'));}
        catch(e){if(t===2||e.http===403)throw e;say('다시 시도 중…');await new Promise(z=>setTimeout(z,1500));}
      }
      parts.push({partNumber:r.partNumber,etag:r.etag});
    }
    return await API.req('/upload/done',{method:'POST',body:{key:st.key,uploadId:st.uploadId,parts}});
  }catch(e){API.req('/upload/done',{method:'POST',body:{key:st.key,uploadId:st.uploadId,abort:true}}).catch(()=>{});throw e;}
}
async function uploadPt(file,member,onp,say){

    case'delinbody':if(!confirm('이 인바디 기록을 지울까요?'))break;Store.del(v);render();break;
    case'saveinbody':{const o=top,vv=o.v,num=k=>vv[k]===''||vv[k]==null?null:+(+vv[k]).toFixed(1);if(num('w')==null||num('m')==null||num('f')==null){toast('체중, 골격근량, 체지방률을 넣어 주세요.');break;}
      Store.set('inbody_'+o.m+'_'+rid(),{kind:'inbody',memberId:o.m,date:o.date,w:num('w'),m:num('m'),f:num('f'),fm:num('fm'),bmi:num('bmi'),bmr:vv.bmr?Math.round(+vv.bmr):null,vf:vv.vf?Math.round(+vv.vf):null});pop();toast('인바디를 기록했어요.');break;}
    case'pkgn':top.total=+v;render();break;
    case'savepkg':{if(!(+top.total>0)){toast('총 횟수를 넣어 주세요.');break;}Store.set('pkg_'+top.m+'_'+ME,{kind:'pkg',memberId:top.m,total:+top.total,start:top.start});pop();toast('회원권을 저장했어요.');break;}
    case'cmem':top.m=v;render();break;
    case'saveclass':{if(!top.m){toast('회원을 골라 주세요.');break;}if(!top.date||!top.time){toast('날짜와 시간을 넣어 주세요.');break;}Store.set('class_'+rid()+rid(),{kind:'class',memberId:top.m,date:top.date,time:top.time,memo:(top.memo||'').trim(),status:'booked'});S.day=top.date;pop();toast(pName(top.m)+'님 수업을 잡았어요.');break;}
    case'classrecord':{const c=Store.data.ptdocs[v];if(!c)break;S.ov.pop();push({type:'session',classId:v,s:{memberId:c.memberId,date:c.date,no:usedOf(c.memberId)+1,parts:[],ex:[],cmt:'',hw:''}});break;}
    case'classdone':{const c=Store.data.ptdocs[v];if(!c)break;const cc=Object.assign({},c,{status:c.status==='done'?'booked':'done'});delete cc.author;Store.set(v,cc);pop();break;}
    case'classdel':if(!confirm('이 수업을 취소할까요?'))break;Store.del(v);pop();break;
    case'pack':top.pack=v;render();break;
    case'sendrenew':{const m=top.i;Store.set('fb_'+rid()+rid(),{kind:'fb',memberId:m,date:today(),type:'renew',text:(top.msg||'').trim()+'\n제안: '+top.pack,card:top.card||[]});pop();toast(pName(m)+'님에게 재등록 안내를 보냈어요.');break;}
    case'sendapp':{const t=(top.text||'').trim();if(!t){toast('내용을 적어 주세요.');break;}el.disabled=true;try{await API.req('/ptfeedback',{method:'POST',body:{text:t}});pop();toast('의견을 보냈어요. 고맙습니다!');}catch(err){el.disabled=false;toast(err.message);}break;}
    case'wk':S.day=addD(S.day,+v);render();break;
    case'pickday':S.day=v;render();break;
  }
});
function addToday(ids){
  const [id,l]=curLog();
  ids.forEach(x=>{if(l.items.some(it=>it.ex===x))return;const e=exById(x);if(e.cardio){l.items.push({ex:x,note:'20분',done:false});return;}const lw=lastWeight(x);const kg=lw?lw.kg:defaultKg(e),reps=lw?lw.reps:10;l.items.push({ex:x,sets:[0,1,2].map(()=>({kg,reps,done:false}))});});
  l.submitted=false;saveLog(id,l,true);
}
document.addEventListener('input',e=>{
  const el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;const top=S.ov[S.ov.length-1];
  if(f==='q'){S.q=el.value;const pos=el.selectionStart;render();const n=document.querySelector('#ov [data-f="q"]')||document.querySelector('[data-f="q"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}return;}
  if(['name','email','pw','myname','joincode'].includes(f)){S.drafts[f]=el.value;return;}
  if(f==='ag-gname'){S.ag.gname=el.value;return;}if(f==='ag-gphone'){S.ag.gphone=el.value;return;}
  if(f==='kg'||f==='reps'){const [id,l]=curLog();const it=l.items[top.i];it.sets[+el.dataset.i][f]=+el.value||0;saveLog(id,l);return;}
  if(f==='note'){const [id,l]=curLog();l.items[top.i].note=el.value;saveLog(id,l);return;}
  if(f==='pmemo'){top.st.memo=el.value;return;}
  if(f==='scmt'){top.s.cmt=el.value;return;}if(f==='shw'){top.s.hw=el.value;return;}
  if(f==='sexset'){top.s.ex[+el.dataset.i][1]=el.value;return;}
  if(f==='sdate'){top.s.date=el.value||today();return;}
  if(f==='ib'){top.v[el.dataset.i]=el.value;return;}if(f==='ibdate'){top.date=el.value||today();return;}
  if(f==='mfood'){top.food=el.value;return;}if(f==='mkcal'){top.kcal=el.value;return;}
  if(f==='cxname'){top.name=el.value;return;}
  if(f==='fbtext'){S.drafts['fb_'+el.dataset.i]=el.value;return;}
  if(f==='pkgtotal'){top.total=el.value;return;}if(f==='pkgstart'){top.start=el.value||today();return;}
  if(f==='cdate'){top.date=el.value;return;}if(f==='ctime'){top.time=el.value;return;}if(f==='cmemo'){top.memo=el.value;return;}
  if(f==='rmsg'){top.msg=el.value;return;}
  if(f==='bdate'){top.date=el.value||today();return;}
  if(f==='ca'||f==='cb'){top[f==='ca'?'a':'b']=el.value;render();return;}
  if(f==='cmp'){const c=document.getElementById('cmp');if(c)c.style.setProperty('--x',el.value+'%');return;}if(f==='fbapp'){top.text=el.value;return;}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.f==='mfile'){const f=el.files&&el.files[0];const c=el.dataset.c;el.value='';if(f){primeAudio();onFile(f,c);}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.ov.length)pop();if(e.key==='Enter'&&e.target.dataset&&['email','pw','name'].includes(e.target.dataset.f)){const b=document.querySelector('[data-a="auth"]');if(b)b.click();}});
async function refresh(){if(!USER||!Store.ready||S.ov.length||document.hidden)return;try{await Store.chain;await Store.load();render();}catch(e){}}
setInterval(refresh,45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
(async function boot(){
  try{const j=await API.req('/me');USER=j.user;ME=j.me;S.admin=!!j.admin;await Store.load();}catch(e){USER=null;}
  S.loading=false;render();
})();

})();
</script>
</body>
