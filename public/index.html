<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FeedUp Golf</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FeedUp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F1;--card:#FFFFFF;--ink:#0F1F17;--muted:#5C6A62;--line:#DAE1DC;
  --green:#0E6A3D;--green-2:#E0EEE5;--flag:#E0322A;--flag-2:#FBE4E2;--sand:#EDE3C8;
  --on-ink:#F2F4F1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1410;--card:#15201A;--ink:#E8EFEA;--muted:#93A39A;--line:#25332B;
    --green:#3DBE7B;--green-2:#163324;--flag:#FF5B4F;--flag-2:#3A1A18;--sand:#3A3424;--on-ink:#0C1410;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1410;--card:#15201A;--ink:#E8EFEA;--muted:#93A39A;--line:#25332B;
  --green:#3DBE7B;--green-2:#163324;--flag:#FF5B4F;--flag-2:#3A1A18;--sand:#3A3424;--on-ink:#0C1410;
  color-scheme:dark;
}
:root{--check:var(--green);--check-2:var(--green-2);--under:var(--flag)}
:root[data-skin="blue"]{
  --paper:#FFFFFF;--card:#FFFFFF;--ink:#111418;--muted:#667085;--line:#E4E7EC;
  --green:#1F5EFF;--green-2:#EAF0FF;--flag:#1F5EFF;--flag-2:#EAF0FF;--sand:#EEF1F5;--on-ink:#FFFFFF;
  --check:#111418;--check-2:#F3F4F6;--under:#E0322A;color-scheme:light;
}
.skin{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.skin i{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--green) 0 50%,var(--ink) 0)}
.topr{display:flex;gap:8px;align-items:center}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px;border-radius:8px}
.num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 120px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  display:flex;align-items:center;justify-content:space-between;padding:12px 18px;max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;letter-spacing:-.02em}
.brand svg{width:22px;height:22px}
.who{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.who svg{width:14px;height:14px;opacity:.6}
.who.coach{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 0 14px}
.bigdate{font-size:64px;font-weight:800;line-height:.85}
.hero .sub{margin-top:6px;font-weight:500}
.tally{text-align:right;line-height:.85}
.tally .n{font-size:64px;font-weight:800}
.tally .d{font-size:30px;font-weight:600;color:var(--muted)}
.tally .lab{font-size:12px;color:var(--muted);margin-top:6px;font-family:'Noto Sans KR',sans-serif}
.seg{display:flex;gap:4px;margin-bottom:18px}
.seg i{flex:1;height:8px;border-radius:2px;background:var(--line);transition:background .25s}
.seg i.on{background:var(--green)}

/* week strip */
.week{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;gap:4px;align-items:stretch;margin-bottom:18px}
.week .nav{display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.week .nav svg{width:16px;height:16px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 0 0;text-align:center;overflow:hidden;position:relative}
.day .w{font-size:11px;color:var(--muted)}
.day .dn{font-size:22px;font-weight:700;line-height:1.1}
.day .fill{height:4px;margin-top:6px;background:var(--line)}
.day .fill b{display:block;height:100%;background:var(--green)}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.day.sel .w{color:var(--on-ink);opacity:.7}
.day.today:not(.sel){border-color:var(--ink)}
.day.fut{opacity:.55}

/* drills */
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.drill{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line);transition:background .2s}
.drill:first-child{border-top:0}
.box{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;transition:all .2s}
.box svg{width:18px;height:18px;opacity:0;transform:scale(.6);transition:all .2s;color:#fff}
.drill.on{background:var(--check-2)}
.drill.on .box{background:var(--check);border-color:var(--check)}
.drill.on .box svg{opacity:1;transform:none;color:var(--on-ink)}
:root:not([data-skin="blue"]) .drill.on .box svg{color:#fff}
.drill .nm{font-weight:700;font-size:15px}
.drill .ds{font-size:12.5px;color:var(--muted)}
.drill .tg{font-size:22px;font-weight:700}
.drill[disabled]{cursor:default}

h2{font-size:15px;font-weight:700;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:500;color:var(--muted);font-size:13px}
textarea,input[type=text],input[type=date],select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical;min-height:48px}
textarea{min-height:88px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:12px;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:16px;margin-top:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{height:42px;font-size:14px;width:auto;padding:0 16px;margin:0}
.btn.danger{background:transparent;color:#E0322A;border:1.5px solid #F5C2BE}
.btn[disabled]{opacity:.5;cursor:default}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sand)}
.dot.g{background:var(--green)}.dot.r{background:var(--flag)}

.fb{margin-top:16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--flag);border-radius:12px;padding:14px 16px}
.fb .who2{font-size:12.5px;font-weight:700;color:var(--flag);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.fb .who2 svg{width:14px;height:14px}
.fb p{margin:0;white-space:pre-wrap}

/* rounds */
.rcard{display:grid;grid-template-columns:1fr auto;gap:6px 12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.rcard .c{font-weight:700}
.rcard .meta{font-size:12.5px;color:var(--muted)}
.rcard .tot{grid-row:1/3;grid-column:2;text-align:right;line-height:.9}
.rcard .tot b{font-size:44px;font-weight:800;display:block}
.rcard .tot span{font-size:18px;font-weight:700}
.under{color:var(--under)}
.stats{display:flex;gap:14px;grid-column:1/3;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px;font-size:13px;color:var(--muted)}
.stats b{font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--ink);font-weight:700;margin-left:3px}
.rcard{cursor:pointer}
.ract{margin-left:auto;display:flex;gap:6px}
.rbtn{height:30px;padding:0 12px;border-radius:8px;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink);background:var(--card)}
.rbtn.del{color:var(--flag);border-color:var(--flag-2)}
.stats{align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--flag-2);color:var(--flag)}
.badge.wait{background:var(--sand);color:var(--ink)}
.badge.log{background:var(--green-2);color:var(--green)}

/* score shapes */
.sc{width:32px;height:32px;display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;margin:0 auto}
.sc.eagle{border:1.5px solid var(--under);border-radius:50%;color:var(--under);box-shadow:0 0 0 2.5px var(--card),0 0 0 4px var(--under)}
.sc.birdie{border:1.5px solid var(--under);border-radius:50%;color:var(--under)}
.sc.bogey{border:1.5px solid var(--ink)}
.sc.double{border:1.5px solid var(--ink);box-shadow:0 0 0 2.5px var(--card),0 0 0 4px var(--ink)}
.sc.none{color:var(--line)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:4px 2px;text-align:center}
.holes .lbl{font-size:11px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:600}
.hcell{padding:6px 0 8px;border-radius:10px;border:1.5px solid transparent}
.hcell.sel{border-color:var(--ink)}
.half{font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 2px}
.hole-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px}
.hole-head .hn{font-size:40px;font-weight:800;line-height:1}
.hole-head .hn small{font-size:18px;color:var(--muted);font-weight:600;margin-left:4px}
.row{margin-bottom:12px}
.row .k{font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-width:44px;height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.pill .num{font-size:18px}
.pill.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pill.on.red{background:var(--under);border-color:var(--under);color:#fff}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.sumrow .v{font-size:34px;font-weight:800;line-height:1}
.sumrow .l{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .v{font-size:36px;font-weight:800;line-height:1}
.kpi .v small{font-size:18px;color:var(--muted);font-weight:600}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.tags h4{margin:14px 0 8px;font-size:13px;font-weight:700}
.tag{height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;margin:0 6px 6px 0}
.tag.on{background:var(--under);border-color:var(--under);color:#fff;font-weight:700}
.tag.good{color:var(--green);border-color:var(--green);font-weight:800}
.tag.good.on{background:var(--green);border-color:var(--green);color:#fff}

.editbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;max-width:560px;margin:0 auto}
.editbar .t{font-weight:700}
.link{font-weight:700;padding:8px 4px}
.grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}

/* report */
.tabs2{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin:6px 0 14px}
.tabs2 button{flex:1;height:38px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs2 button.on{background:var(--ink);color:var(--on-ink)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pnav .r{font-size:28px;font-weight:700}
.pnav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.pnav button svg{width:16px;height:16px}
.bars{display:flex;align-items:flex-end;gap:3px;height:80px;padding-top:6px}
.bars div{flex:1;height:100%;background:var(--green-2);border-radius:3px 3px 0 0;position:relative;min-height:3px}
.bars div b{position:absolute;left:0;right:0;bottom:0;background:var(--green);border-radius:3px 3px 0 0}
.bars div.fut{opacity:.35}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;font-family:'Barlow Condensed',sans-serif}
.hbar{display:grid;grid-template-columns:1fr 46px;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hbar:first-child{border-top:0}
.hbar .nm{font-size:14px;font-weight:500}
.hbar .p{font-size:20px;font-weight:700;text-align:right}
.hbar .track{grid-column:1/3;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.hbar .track b{display:block;height:100%;background:var(--green)}
.miss{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.miss:first-child{border-top:0}
.miss b{font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--under)}
.ai{background:var(--ink);color:var(--on-ink);border-radius:16px;padding:18px;margin-top:10px}
.ai h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.ai h3 svg{width:18px;height:18px}
.ai .out{white-space:pre-wrap;font-size:14.5px;line-height:1.65;margin-top:12px}
.ai .btn{background:var(--on-ink);color:var(--ink)}
.ai .meta{font-size:12px;opacity:.65}
.empty{text-align:center;color:var(--muted);padding:28px 16px;background:var(--card);border:1px dashed var(--line);border-radius:16px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chips button{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13.5px}
.chips button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.inbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.inbox .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.inbox .pn{font-weight:900;font-size:16px}
.inbox .dt{font-size:13px;color:var(--muted)}
.inbox .body{margin:10px 0;font-size:14px}
.inbox .memo{border-left:3px solid var(--line);padding:2px 0 2px 10px;color:var(--muted);white-space:pre-wrap;margin-top:8px}
.inbox textarea{min-height:72px}
.inbox .acts{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.mini{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin-top:8px}
.mini .sc{width:26px;height:26px;font-size:16px}
.setrow{display:grid;grid-template-columns:1fr 90px 40px;gap:6px;margin-bottom:6px;align-items:center}
.setrow input{min-height:42px;padding:8px 10px}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:18px;height:18px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-weight:700}
.prow:first-child{border-top:0}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{display:flex;max-width:560px;margin:0 auto}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--flag);border-radius:0 0 3px 3px}
.tabbar .cnt{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--flag);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,8,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:20px;font-weight:900}
.sheet .opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:8px;font-weight:700;text-align:left}
.sheet .opt.coach{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.addline{display:flex;gap:8px;margin-top:12px}
.addline input{flex:1}
.dlg{position:fixed;inset:0;background:rgba(5,12,8,.5);z-index:70;display:grid;place-items:center;padding:24px}
.dlg .box2{background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%}
.dlg p{margin:0 0 16px;font-weight:700;font-size:16px;line-height:1.45}
.dlg .acts2{display:flex;gap:8px}
.dlg .acts2 .btn{margin:0;height:46px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:60;max-width:90%;text-align:center}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}


/* ---- minimal brand screens ---- */
.logo{font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-weight:900;letter-spacing:-.065em;line-height:.88;color:#0B0B0C;margin:0}
.splash,.onb{background:#fff;color:#0B0B0C}
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:center;padding:calc(32px + env(safe-area-inset-top,0px)) 36px calc(32px + env(safe-area-inset-bottom,0px));cursor:pointer;transition:opacity .45s ease,visibility .45s}
.splash.out{opacity:0;visibility:hidden}
.splash .in,.onb .in{max-width:420px;margin:0 auto;width:100%}
.splash .logo{font-size:clamp(52px,17vw,96px);white-space:nowrap}
.splash .en{font-family:'Inter',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em;color:#9A9A9F;margin-top:14px}
.splash .copy{font-size:24px;font-weight:900;line-height:1.32;letter-spacing:-.04em;margin-top:44px}
.splash .desc{font-size:14px;color:#8E8E93;margin-top:12px}
.splash .skip{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:#B5B5BA}
.chipk{display:inline-block;font-family:'Inter',sans-serif;font-weight:800;font-size:11px;letter-spacing:.14em;background:#0B0B0C;color:#fff;border-radius:6px;padding:4px 8px;margin-bottom:22px}

const I={

const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d);};

const monday=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d);};
const md=s=>{const d=pd(s);return pad(d.getMonth()+1)+'.'+pad(d.getDate());};

const vsPar=n=>n===0?'E':(n>0?'+'+n:String(n));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const safeKey=s=>String(s).replace(/[^A-Za-z0-9_\-.~@+]/g,'_').slice(0,100);

/* ---------- api + store ---------- */
const API={
  async req(path,opt){
    opt=opt||{};
    const r=await fetch('/api'+path,{method:opt.method||'GET',credentials:'same-origin',
      headers:opt.body?{'content-type':'application/json'}:{},body:opt.body?JSON.stringify(opt.body):undefined});
    let j={};try{j=await r.json();}catch(e){}
    if(!r.ok){const e=new Error(j.error||('요청에 실패했어요 ('+r.status+')'));e.status=r.status;throw e;}
    return j;
  }
};
const Store={
  ready:false,inflight:0,
  data:Object.fromEntries(COLS.map(c=>[c,{}])),
  queue:{},
  async load(){
    const d=await API.req('/state');
    if(this.inflight>0)return;
    COLS.forEach(c=>{this.data[c]=d[c]||{};});
    this.ready=true;requestRender();
  },
  chain(key,fn){
    this.inflight++;
    const prev=this.queue[key]||Promise.resolve();
    const p=prev.then(fn).catch(e=>{
      console.warn(e);
      if(e.status===401){location.reload();return;}
      toast(e.message||'저장하지 못했어요. 잠시 뒤 다시 시도하세요.');
      this.inflight=Math.max(0,this.inflight-1);this.load().catch(()=>{});this.inflight++;
    }).finally(()=>{this.inflight=Math.max(0,this.inflight-1);});
    this.queue[key]=p;return p;
  },
  set(c,id,obj){
    this.data[c]=Object.assign({},this.data[c],{[id]:obj});
    return this.chain(c+'/'+id,()=>API.req('/docs',{method:'POST',body:{op:'set',col:c,id,data:obj}}));
  },
  update(c,id,patch){
    const next=Object.assign({},this.data[c][id]||{},patch);
    return this.set(c,id,next);
  },
  del(c,id){

function hwGroups(p,d){
  // 그날 기준 가장 최근 레슨의 숙제 하나만 보여줘요. 새 숙제가 생기면 이전 숙제는 사라지고, 레슨일부터 1주일(7일) 동안만 표시해요.
  if(!d)return[];
  let best=null;
  allLessons().forEach(l=>{
    if(l.playerId!==p||!hwLines(l).length||l.date>d)return;
    if(!best||best.date<l.date||(best.date===l.date&&(best.createdAt||0)<(l.createdAt||0)))best=l;
  });
  if(!best||addD(best.date,6)<d)return[];
  return [{owner:'hw',coachId:best.coachId,lesson:best,items:hwLines(best).map((x,i)=>({id:'hw'+i,name:x,target:'',key:'hw:'+best.id+':'+i,hw:true}))}];
}
function groups(p,d){
  const g=[{owner:'me',coachId:null,items:ownDrills(p).map(d=>Object.assign({},d,{key:'me:'+d.id,legacy:d.id}))}];
  coachesOf(p).forEach(c=>{const it=coachDrills(c);if(it.length)g.push({owner:c,coachId:c,items:it.map(d=>Object.assign({},d,{key:c+':'+d.id}))});});
  return g.concat(hwGroups(p,d));
}

}

function rs(r){
  const o={n:0,tot:0,par:0,vs:0,putt:0,fw:0,fwN:0,gir:0,rec:0,recN:0,out:0,inn:0};
  (r.holes||[]).forEach((h,i)=>{
    if(!h.score)return;
    o.n++;o.tot+=h.score;o.par+=h.par;o.putt+=(h.putt||0);
    if(i<9)o.out+=h.score;else o.inn+=h.score;
    if(h.par>=4){o.fwN++;if(h.fw==='hit')o.fw++;}
    const gir=(h.score-(h.putt==null?2:h.putt))<=h.par-2;
    if(gir)o.gir++;else{o.recN++;if(h.score<=h.par)o.rec++;}
  });
  o.vs=o.tot-o.par;return o;
}
function shape(h){
  if(!h||!h.score)return'<div class="sc none">·</div>';
  const d=h.score-h.par;
  const cls=d<=-2?'eagle':d===-1?'birdie':d===0?'':d===1?'bogey':'double';
  return '<div class="sc '+cls+'">'+h.score+'</div>';
}

/* ---------- report ---------- */
function range(){
  if(S.period==='week'){const s=monday(S.anchor);return{s,e:addD(s,6),key:'W'+s,label:md(s)+' – '+md(addD(s,6))};}
  const d=pd(S.anchor),s=ds(new Date(d.getFullYear(),d.getMonth(),1)),e=ds(new Date(d.getFullYear(),d.getMonth()+1,0));
  return{s,e,key:'M'+s.slice(0,7),label:d.getFullYear()+'.'+pad(d.getMonth()+1)};
}
function rstat(list){
  const st=list.map(rs).filter(s=>s.n>0),sum=k=>st.reduce((a,s)=>a+s[k],0),full=st.filter(s=>s.n===18);
  const mm=list.map(r=>+r.mentalScore||0).filter(Boolean);
  return{mental:mm.length?(mm.reduce((a,b)=>a+b,0)/mm.length).toFixed(1):null,count:list.length,avg:full.length?(full.reduce((a,s)=>a+s.tot,0)/full.length).toFixed(1):null,
    putt:st.length?(sum('putt')/sum('n')*18).toFixed(1):null,fw:pct(sum('fw'),sum('fwN')),gir:pct(sum('gir'),sum('n')),rec:pct(sum('rec'),sum('recN')),has:st.length>0};
}
function compute(p){
  const R=range(),t=today(),base=allItems(p),days=[];
  for(let d=R.s;d<=R.e;d=addD(d,1))days.push(d);
  const daily=days.map(d=>{const L=getLog(p,d),it=allItems(p,d),dn=doneOf(L,it);return{d,L,it,done:dn,pc:it.length?dn/it.length:0,fut:d>t};});
  const pdays=daily.filter(x=>!x.fut);
  const completion=pdays.length?Math.round(pdays.reduce((a,x)=>a+x.pc,0)/pdays.length*100):0;
  const active=pdays.filter(x=>x.done>0).length;
  const perDrill=base.map(x=>({name:x.name,target:x.target,group:x.group,days:pdays.filter(y=>isChk(y.L,x)).length}));
  let hwDone=0,hwTot=0;pdays.forEach(x=>{const h=x.it.filter(i=>i.hw);hwTot+=h.length;hwDone+=doneOf(x.L,h);});
  const lessons=lessonsOf(p).filter(l=>l.date>=R.s&&l.date<=R.e).sort((a,b)=>a.date.localeCompare(b.date));
  const tc={};lessons.forEach(l=>(l.topics||[]).forEach(x=>{tc[x]=(tc[x]||0)+1;}));
  const rounds=allRounds().filter(r=>r.playerId===p&&r.date>=R.s&&r.date<=R.e).sort((a,b)=>a.date.localeCompare(b.date));
  const rnd=rstat(rounds),rp=rstat(rounds.filter(r=>KIND(r)!=='match')),rm=rstat(rounds.filter(r=>KIND(r)==='match'));
  const mc={},gc={};let goodN=0;rounds.forEach(r=>(r.misses||[]).forEach(m=>{if(isGood(m)){goodN++;const c=goodCat(m);gc[c]=(gc[c]||0)+1;return;}mc[m]=(mc[m]||0)+1;}));
  const goods=Object.keys(MISS).concat(['기타']).filter(c=>gc[c]).map(c=>[c,gc[c]]);
  const misses=Object.entries(mc).sort((a,b)=>b[1]-a[1]);
  const fbs=[];
  pdays.forEach(x=>fbsFor('log',logId(p,x.d),p).forEach(f=>fbs.push(Object.assign({},f,{type:'연습',memo:x.L.memo||''}))));
  lessons.forEach(l=>fbsFor('lesson',l.id,p).forEach(f=>fbs.push(Object.assign({},f,{type:'레슨',memo:l.content||''}))));
  rounds.forEach(r=>fbsFor('round',r.id,p).forEach(f=>fbs.push(Object.assign({},f,{type:KIND(r)==='match'?'시합':'라운드',memo:r.memo||''}))));
  fbs.sort((a,b)=>a.date.localeCompare(b.date));
  return{R,daily,pastN:pdays.length,completion,active,perDrill,rounds,rnd,rp,rm,misses,fbs,items:base,goodN,goods,lessons,topics:Object.entries(tc).sort((a,b)=>b[1]-a[1]),hw:{done:hwDone,tot:hwTot}};
}

async function demoSummary(C,coach){
  await new Promise(r=>setTimeout(r,700));

  const R=C.rnd,L=[];
  if(!C.active&&!C.rounds.length&&!C.fbs.length&&!C.lessons.length){
    return{text:'한 줄 요약\n'+per+'에는 아직 기록이 없어요.\n\n연습을 체크하고 라운드를 기록하면, 완료율과 라운드 지표를 바탕으로 잘한 점과 보완할 점을 정리해 드려요.'};
  }
  L.push('한 줄 요약');
  L.push(per+' '+C.pastN+'일 중 '+C.active+'일 연습했고 평균 완료율은 '+C.completion+'%예요'+(R.has?'. 라운드는 '+R.count+'회'+(R.avg?', 평균 '+R.avg+'타':'')+'예요.':'.'));
  if(C.lessons.length)L.push('레슨은 '+C.lessons.length+'회'+(C.topics.length?'('+C.topics.slice(0,2).map(x=>x[0]).join(', ')+' 위주)':'')+' 받았어요'+(C.hw.tot?', 숙제 수행률은 '+pct(C.hw.done,C.hw.tot)+'%예요.':'.'));
  if(C.rp.avg&&C.rm.avg){const g=C.rm.avg-C.rp.avg;L.push('시합 평균은 '+C.rm.avg+'타로 연습보다 '+Math.abs(g).toFixed(1)+'타 '+(g>0?'많았어요.':'적었어요.'));}
  if(C.pastN<4||C.active<3)L.push('아직 기록이 많지 않아 경향은 참고만 해 주세요.');
  L.push('','잘한 점');
  const good=drills.filter(x=>x.pc>=50).slice(0,2).map(x=>'• '+x.name+' '+x.days+'/'+C.pastN+'일('+x.pc+'%) 꾸준히 했어요.');
  if(R.has&&R.fw>=50)good.push('• 페어웨이 안착률 '+R.fw+'%로 티샷이 안정적이에요.');
  if(R.has&&R.gir>=40)good.push('• 그린 적중률 '+R.gir+'%로 아이언 샷이 잘 맞고 있어요.');
  if(C.hw.tot&&pct(C.hw.done,C.hw.tot)>=70)good.push('• 레슨 숙제를 '+pct(C.hw.done,C.hw.tot)+'% 해냈어요.');
  if(C.goodN)good.push('• 라운드에서 굿을 '+C.goodN+'개 남겼어요('+C.goods.map(x=>x[0]+' '+x[1]).join(', ')+').');
  if(!good.length)good.push('• 기록을 시작한 것 자체가 좋은 출발이에요. 매일 체크하는 습관부터 만들어 봐요.');
  L.push(...good.slice(0,3));
  L.push('','보완할 점');
  const low=drills.filter(x=>x.pc<50).slice(-2).reverse();
  const bad=low.map(x=>'• '+x.name+' 항목은 '+x.days+'/'+C.pastN+'일('+x.pc+'%)만 체크했어요.');
  if(C.hw.tot&&pct(C.hw.done,C.hw.tot)<50)bad.push('• 레슨 숙제 수행률이 '+pct(C.hw.done,C.hw.tot)+'%로 낮아요.');
  if(C.rp.avg&&C.rm.avg&&C.rm.avg-C.rp.avg>=3)bad.push('• 시합에서 연습보다 '+(C.rm.avg-C.rp.avg).toFixed(1)+'타 더 쳐서, 실전 긴장 관리가 과제예요.');
  if(C.rp.mental&&C.rm.mental&&C.rm.mental<C.rp.mental-0.4)bad.push('• 시합 멘탈 점수가 '+C.rm.mental+'점으로 연습 라운드('+C.rp.mental+'점)보다 낮아요.');
  if(R.has&&+R.putt>=33)bad.push('• 18홀 기준 평균 퍼트가 '+R.putt+'개로 많은 편이에요.');
  if(C.misses.length)bad.push('• 가장 많이 나온 미스 원인은 '+C.misses[0][0].replace(':',' / ')+'('+C.misses[0][1]+'회)예요.');
  if(!bad.length)bad.push('• 크게 빠진 항목이 없어요. 지금 리듬을 유지해 봐요.');
  L.push(...bad.slice(0,3));
  L.push('','피드백에서 반복된 주제');
  if(!C.fbs.length)L.push('• 이 기간 피드백 없음');
  else C.fbs.slice(-3).forEach(f=>L.push('• '+md(f.date)+' '+(f.coachId===ME?'내 피드백':cName(f.coachId))+': '+(f.text.length>40?f.text.slice(0,40)+'…':f.text)));
  L.push('',nxt+' 연습 포커스');
  const focus=[];
  low.forEach(x=>focus.push('• '+x.name+(x.target?'(목표 '+x.target+')':'')+' 주 '+(S.period==='week'?'4':'3')+'회 이상 체크하기'));
  if(C.hw.tot&&pct(C.hw.done,C.hw.tot)<70)focus.push('• 레슨 숙제를 오늘 체크리스트에서 매일 먼저 체크하기');
  if(C.misses.length){const cat=C.misses[0][0].split(':')[0];if(MISS_TIP[cat])focus.push('• '+MISS_TIP[cat]);}
  if(R.has&&+R.putt>=33)focus.push('• '+MISS_TIP['퍼팅']);
  if(focus.length<3)focus.push('• 연습 후 메모를 남겨 '+(coach?'선수의 체감과 기록을 함께 보기':'코치가 컨디션까지 알 수 있게 하기'));
  if(focus.length<3)focus.push('• 라운드를 마치면 홀별 기록과 미스 원인을 남기기');
  L.push(...focus.slice(0,3));
  return{text:L.join('\n')};
}

function videoDuration(file){
  return new Promise(res=>{
    const v=document.createElement('video'),u=URL.createObjectURL(file);let done=false;
    v.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0';
    const fin=d=>{if(done)return;done=true;try{v.remove();}catch(e){}URL.revokeObjectURL(u);res(d);};
    const check=()=>{if(isFinite(v.duration)&&v.duration>0)fin(v.duration);};
    v.preload='metadata';v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');
    v.addEventListener('loadedmetadata',check);v.addEventListener('durationchange',check);v.addEventListener('canplay',check);
    v.onerror=()=>fin(null);setTimeout(()=>fin(null),12000);
    document.body.appendChild(v);v.src=u;try{v.load();}catch(e){}
  });
}
function shrinkImage(file){
  return new Promise(res=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const M=1600,sc=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(b=>res(b||file),'image/jpeg',0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);res(file);};
    img.src=u;
  });
}

function pickMime(){
  const c=['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1.4D401F','video/mp4;codecs=avc1','video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm','video/mp4'];
  return c.find(t=>{try{return MediaRecorder.isTypeSupported(t);}catch(e){return false;}})||'';
}
function canRecode(){return typeof MediaRecorder!=='undefined'&&typeof HTMLCanvasElement!=='undefined'&&!!HTMLCanvasElement.prototype.captureStream;}
// 영상을 720p로 다시 만들어 용량을 줄여요(소리는 빼요). 실패하면 null.
function recodeVideo(file,onp){
  return new Promise(res=>{
    const v=document.createElement('video'),u=URL.createObjectURL(file);let finished=false,rec=null,raf=0,guard=0;
    v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='auto';
    v.style.cssText='position:fixed;left:0;top:0;width:4px;height:4px;opacity:0.01;pointer-events:none;z-index:-1';
    const done=b=>{if(finished)return;finished=true;cancelAnimationFrame(raf);clearTimeout(guard);try{v.pause();v.remove();}catch(e){}URL.revokeObjectURL(u);res(b);};
    v.onerror=()=>done(null);
    v.onloadedmetadata=async()=>{
      try{
        const M=720,vw=v.videoWidth||720,vh=v.videoHeight||1280,sc=Math.min(1,M/Math.max(vw,vh));
        const w=Math.max(2,Math.round(vw*sc/2)*2),h=Math.max(2,Math.round(vh*sc/2)*2);
        const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
        g.fillStyle='#000';g.fillRect(0,0,w,h);
        const mime=pickMime(),stream=c.captureStream(30);
        rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:2500000}:{videoBitsPerSecond:2500000});
        const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
        rec.onstop=()=>{const type=((rec.mimeType||mime||'video/webm').split(';')[0])||'video/webm';const b=new Blob(chunks,{type});done(b.size>20000?b:null);};
        const draw=()=>{try{g.drawImage(v,0,0,w,h);}catch(e){}if(onp&&v.duration)onp(Math.min(1,v.currentTime/v.duration));if(!v.ended)raf=requestAnimationFrame(draw);};
        v.onended=()=>{try{g.drawImage(v,0,0,w,h);}catch(e){}setTimeout(()=>{if(rec.state!=='inactive')rec.stop();},200);};
        rec.start(250);
        await v.play();
        draw();
        guard=setTimeout(()=>{try{if(rec.state!=='inactive')rec.stop();else done(null);}catch(e){done(null);}},((v.duration||10)+6)*1000);
      }catch(e){try{if(rec&&rec.state!=='inactive')rec.stop();}catch(x){}done(null);}
    };
    document.body.appendChild(v);v.src=u;try{v.load();}catch(e){}
  });
}
function uploadBlob(url,blob,type,onp){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    x.open('POST',url);x.withCredentials=true;x.timeout=180000;x.setRequestHeader('content-type',type);
    x.upload.onprogress=e=>{if(e.lengthComputable&&onp)onp(e.loaded/e.total);};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText);}catch(e){}
      if(x.status>=200&&x.status<300)res(j);else{const er=new Error((j.error||'올리지 못했어요.')+' (오류 '+x.status+')');er.http=x.status;rej(er);}};
    x.onerror=x.ontimeout=()=>rej(new Error('인터넷 연결이 불안정해서 올리지 못했어요. 와이파이에서 다시 시도해 주세요.'));
    x.send(blob);
  });
}
async function addMedia(file){
  const l=S.lesson;if(!l||!file)return;
  S.mediaMsg='';
  if(l.media.length+S.uploading>=6){mErr('사진·영상은 6개까지 올릴 수 있어요.');return;}
  const name=(file.name||'').toLowerCase();
  let type=(file.type||'').toLowerCase();
  if(!type)type=/\.mov$/.test(name)?'video/quicktime':/\.(mp4|m4v)$/.test(name)?'video/mp4':/\.webm$/.test(name)?'video/webm':/\.(jpe?g)$/.test(name)?'image/jpeg':/\.png$/.test(name)?'image/png':/\.(heic|heif)$/.test(name)?'image/heic':'';
  let blob=file;
  S.uploading++;setUp('준비 중…');render();
  try{
    if(type.startsWith('image/')){
      blob=await shrinkImage(file);type=(blob.type||'').toLowerCase();
      if(!/^image\/(jpeg|png|webp|gif)$/.test(type))throw new Error('이 사진 형식('+(type||'알 수 없음')+')은 올릴 수 없어요. 아이폰이라면 설정 > 카메라 > 포맷에서 "높은 호환성"을 고르거나, 스크린샷으로 올려 주세요.');
    }else if(type.startsWith('video/')){
      if(type==='video/x-m4v')type='video/mp4';
      setUp('영상 확인 중…');
      const d=await videoDuration(file);
      if(d==null)throw new Error('영상 길이를 확인하지 못했어요. 사진 앱에서 영상을 10초 미만으로 잘라서 다시 올려 주세요.');
      if(d>=10)throw new Error('10초 미만 영상만 올릴 수 있어요. 지금 영상은 '+d.toFixed(1)+'초예요. 사진 앱의 편집에서 잘라서 올려 주세요.');
      let small=null;
      if(canRecode()){setUp('영상 줄이는 중 0%');small=await recodeVideo(file,p=>setUp('영상 줄이는 중 '+Math.round(p*100)+'%'));}
      if(small&&small.size<file.size){blob=small;type=small.type||'video/webm';}
      else{
        if(!/^video\/(mp4|quicktime|webm)$/.test(type))throw new Error('이 영상 형식('+type+')은 올릴 수 없어요. mp4나 mov 영상을 골라 주세요.');
        if(file.size>40*1024*1024)throw new Error('영상 용량이 너무 커요('+Math.round(file.size/1048576)+'MB). 아이폰은 설정 > 카메라 > 비디오 녹화를 1080p로 바꾸고 찍어 주세요.');
      }
    }else throw new Error('사진이나 영상 파일만 올릴 수 있어요.');
    const url='/api/media?lesson='+encodeURIComponent(l.id);
    let j=null;
    for(let t=0;t<2&&!j;t++){
      try{setUp('올리는 중 0%');j=await uploadBlob(url,blob,type,p=>setUp('올리는 중 '+Math.round(p*100)+'%'));}
      catch(e){if(t===1||e.http)throw e;setUp('다시 시도 중…');await new Promise(r=>setTimeout(r,1500));}
    }
    if(S.lesson&&S.lesson.id===l.id){S.lesson.media.push({key:j.key,type:j.type});S.newKeys.push(j.key);}
    else API.req('/media/'+j.key,{method:'DELETE'}).catch(()=>{});
    S.mediaMsg='';
  }catch(e){S.mediaMsg=e.message;toast(e.message);}
  S.uploading=Math.max(0,S.uploading-1);S.upMsg='';render();
}
function dropNewMedia(){S.newKeys.forEach(k=>API.req('/media/'+k,{method:'DELETE'}).catch(()=>{}));S.newKeys=[];}

    case'agage':S.ag.age=v;render();break;
    case'terms':S.termsView=v;render();break;
    case'closeterms':S.termsView=null;render();break;
    case'consent':{
      if(!agOk()){S.authErr='필수 항목에 모두 동의해 주세요.';render();break;}
      S.authBusy=true;S.authErr='';render();
      try{await API.req('/consent',{method:'POST',body:{agree:S.ag}});await Store.load();}catch(err){S.authErr=err.message;}
      S.authBusy=false;render();break;}
    case'wdopen':S.withdraw=true;render();break;
    case'wdcancel':S.withdraw=false;delete S.drafts.wdpw;render();break;
    case'withdraw':{
      const pw=S.drafts.wdpw||'';if(!pw){toast('비밀번호를 입력해 주세요.');break;}
      try{await API.req('/account/delete',{method:'POST',body:{password:pw}});toast('탈퇴가 완료됐어요.');setTimeout(()=>location.reload(),900);}
      catch(err){toast(err.message);}
      break;}
    case'auth':{
      if(S.authBusy)break;
      const su=S.authMode==='signup',D=S.drafts;
      S.authBusy=true;S.authErr='';render();
      try{
        if(su&&!agOk())throw new Error('약관 동의와 나이 확인을 완료해 주세요.');
        const j=await API.req(su?'/auth/signup':'/auth/login',{method:'POST',body:{email:D.email,password:D.pw,name:D.name,agree:su?S.ag:undefined}});
        USER=j.user;ME=j.me;delete D.pw;S.loading=true;render();
        await Store.load();try{S.admin=!!(await API.req('/me')).admin;}catch(e){}S.loading=false;
      }catch(err){S.authErr=err.message;}
      S.authBusy=false;render();break;}
    case'logout':ask('로그아웃할까요?','로그아웃',async()=>{try{await API.req('/auth/logout',{method:'POST'});}catch(e){}location.reload();});break;
    case'skin':SKIN=SKIN==='blue'?'green':'blue';lsSet('sn_skin',SKIN);applySkin();render();break;
    case'mode':setMode(v);break;
    case'tab':flushLogs();S.tab=v;S.dd={};render();try{window.scrollTo(0,0);}catch(e){}break;
    case'date':flushLogs();S.date=v;render();break;
    case'wk':flushLogs();S.date=addD(S.date,+v);render();break;
    case'chk':{
      const it=allItems(ME,S.date).find(i=>i.key===v);if(!it)break;
      const L=getLog(ME,S.date);const c=Object.assign({},L.checks||{});const was=isChk(L,it);
      c[it.key]=!was;if(it.legacy)delete c[it.legacy];
      updateLog(ME,S.date,{checks:c},300);render();break;}
    case'submit':updateLog(ME,S.date,{submitted:true,submittedAt:Date.now()},0);toast('코치에게 제출했어요.');render();break;
    case'newround':S.reviewOpen=false;S.round=newRound(v);S.roundRO=false;S.roundSnap=JSON.stringify(S.round);S.hole=0;render();try{window.scrollTo(0,0);}catch(e){}break;
    case'openround':case'viewround':openRound(v,true);break;
    case'editfromlist':openRound(v,false);break;
    case'delfromlist':ask('이 라운드를 삭제할까요?','삭제',()=>{Store.del('rounds',v);toast('라운드를 삭제했어요.');render();},true);break;
    case'editround':if(r&&r.playerId===ME){S.roundRO=false;S.roundSnap=JSON.stringify(S.round);render();}break;
    case'closeround':
      if(S.roundRO||JSON.stringify(S.round)===S.roundSnap){closeRound();break;}
      ask('저장하지 않은 내용은 사라져요. 닫을까요?','닫기',closeRound,true);break;
    case'hole':S.hole=+v;render();break;
    case'rk':S.rkind=v;render();break;
    case'rkind':r.kind=v;r.match=r.match||{name:'',round:'1R',rank:'',field:'',tension:0};render();break;
    case'mscore':r.mentalScore=+r.mentalScore===+v?0:+v;render();break;
    case'mround':r.match.round=v;render();break;
    case'mtension':r.match.tension=+r.match.tension===+v?0:+v;render();break;
    case'kid':S.child=v;S.ai={busy:false,key:null,text:''};render();break;
    case'lpf':S.lessonPlayer=v;render();break;
    case'newlesson':S.mediaMsg='';S.lesson=newLesson();S.newKeys=[];S.lessonSnap=JSON.stringify(S.lesson);render();try{window.scrollTo(0,0);}catch(e){}break;
    case'editlesson':{const src=Store.data.lessons[v];if(!src)break;const o=JSON.parse(JSON.stringify(src));o.id=v;o.topics=o.topics||[];o.media=o.media||[];o.coachId=o.coachId||'';o.coachName=o.coachName||'';S.lesson=o;S.newKeys=[];S.lessonSnap=JSON.stringify(o);render();try{window.scrollTo(0,0);}catch(e){}break;}
    case'closelesson':
      if(JSON.stringify(S.lesson)===S.lessonSnap&&!S.newKeys.length){S.lesson=null;render();break;}
      ask('저장하지 않은 내용은 사라져요. 닫을까요?','닫기',()=>{dropNewMedia();S.lesson=null;render();},true);break;
    case'lcoach':S.lesson.coachId=v;render();break;
    case'ltopic':{const t=S.lesson.topics,i=t.indexOf(v);if(i>=0)t.splice(i,1);else t.push(v);render();break;}
    case'mdel':{const m=S.lesson.media.splice(+v,1)[0];if(m&&S.newKeys.includes(m.key)){S.newKeys=S.newKeys.filter(k=>k!==m.key);API.req('/media/'+m.key,{method:'DELETE'}).catch(()=>{});}render();break;}
    case'viewmedia':S.viewer={key:el.dataset.k,type:el.dataset.t};render();break;
    case'closeviewer':if(e.target.closest('video'))break;S.viewer=null;render();break;
    case'savelesson':{
      const l=S.lesson;
      if(S.uploading){toast('사진·영상을 올리는 중이에요. 잠시만 기다려 주세요.');break;}
      if(!l.content.trim()&&!l.homework.trim()&&!l.media.length){toast('배운 내용이나 숙제, 사진·영상 중 하나는 남겨 주세요.');break;}
      const o=JSON.parse(JSON.stringify(l)),id=o.id;delete o.id;const existed=!!Store.data.lessons[id];
      Store.set('lessons',id,o);S.lesson=null;S.newKeys=[];toast(existed?'레슨을 수정했어요.':'레슨을 기록했어요.'+(o.coachId?' 코치에게도 보여요.':''));render();break;}
    case'dellesson':ask('이 레슨 기록을 삭제할까요? 사진·영상도 함께 지워져요.','삭제',()=>{Store.del('lessons',v);S.lesson=null;toast('레슨을 삭제했어요.');render();},true);break;
    case'newpcode':try{await API.req('/pcode',{method:'POST'});await Store.load();toast('학부모 초대 코드를 만들었어요.');}catch(err){toast(err.message);}render();break;
    case'pjoin':{const c=(S.drafts.pjoin||'').trim().toUpperCase().replace(/\s/g,'');if(!c){toast('자녀에게 받은 코드를 입력하세요.');break;}
      try{const j=await API.req('/pjoin',{method:'POST',body:{code:c}});S.drafts.pjoin='';await Store.load();toast((j.childName?j.childName+' ':'')+'자녀와 연결했어요.');setMode('parent');}catch(err){toast(err.message);}break;}
    case'unparent':ask('학부모 연결을 해제할까요?','해제',()=>{Store.del('parents',v);render();},true);break;
    case'par':{const h=r.holes[S.hole];const rel=h.score?h.score-h.par:null;h.par=+v;if(rel!=null)h.score=h.par+rel;if(h.par===3)h.fw=null;render();break;}
    case'sc':{const before=r.holes.filter(x=>x.score).length;const h=r.holes[S.hole];h.score=h.par+(+v);
      const after=r.holes.filter(x=>x.score).length;render();
      if(before<18&&after===18&&!r.memo){toast('18홀 입력 완료! 이제 라운드 총평을 적어 주세요.');setTimeout(()=>{const el=document.getElementById('review');if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-70,behavior:'smooth'});},400);}
      break;}
    case'openreview':S.reviewOpen=true;render();break;
    case'pt':r.holes[S.hole].putt=+v;render();break;
    case'fw':{const h=r.holes[S.hole];h.fw=h.fw===v?null:v;render();break;}
    case'miss':{r.misses=r.misses||[];const i=r.misses.indexOf(v);if(i>=0)r.misses.splice(i,1);else r.misses.push(v);render();break;}
    case'saveround':{
      const o=JSON.parse(JSON.stringify(r));const id=o.id;delete o.id;o.updatedAt=Date.now();
      const existed=!!Store.data.rounds[id];Store.set('rounds',id,o);closeRound();
      toast(existed?'수정 내용을 저장했어요.':'라운드를 저장했어요. 연결된 코치에게도 보여요.');break;}
    case'delround':{const id=r.id;ask('이 라운드를 삭제할까요?','삭제',()=>{Store.del('rounds',id);closeRound();toast('라운드를 삭제했어요.');},true);break;}
    case'dlgok':{const f=S.dlg&&S.dlg.fn;S.dlg=null;render();if(f)await f();break;}
    case'dlgno':S.dlg=null;render();break;
    case'period':S.period=v;render();break;
    case'pmove':{if(S.period==='week')S.anchor=addD(monday(S.anchor),7*(+v));else{const d=pd(S.anchor);S.anchor=ds(new Date(d.getFullYear(),d.getMonth()+(+v),1));}render();break;}
    case'rp':S.reportPlayer=v;render();break;
    case'ai':if(!S.ai.busy)runAI();break;
    case'if':S.inboxFilter=v;render();break;
    case'ip':S.inboxPlayer=v;render();break;
    case'sendfb':{
      const i=v.indexOf(':'),kind=v.slice(0,i),ref=v.slice(i+1);
      const cur=Store.data.feedback[fbId(ME,kind,ref)];
      const txt=(S.drafts[v]!=null?S.drafts[v]:(cur?cur.text:'')).trim();
      if(!txt){toast('피드백 내용을 입력하세요.');break;}
      await Store.set('feedback',fbId(ME,kind,ref),{coachId:ME,playerId:el.dataset.p,kind,ref,date:el.dataset.d,text:txt,at:Date.now()});
      delete S.drafts[v];toast('피드백을 보냈어요.');render();break;}
    case'newcode':try{await newCode();toast('초대 코드를 만들었어요.');}catch(err){toast(err.message);}render();break;
    case'startcoach':try{await newCode();}catch(err){toast(err.message);break;}setMode('coach');S.tab='players';render();toast('코치 기능을 켰어요. 초대 코드를 선수에게 알려주세요.');break;
    case'approve':await Store.update('links',v,{status:'active',approvedAt:Date.now()});toast('연결했어요.');render();break;
    case'unlink':{const l=Store.data.links[v];if(!l)break;
      const other=l.coachId===ME?pName(l.playerId)+' 선수':cName(l.coachId)+'';
      const msg=l.status==='pending'?(l.coachId===ME?other+'의 요청을 거절할까요?':'연결 요청을 취소할까요?'):other+'와 연결을 해제할까요? 지금까지 주고받은 피드백은 남아 있어요.';
      ask(msg,l.status==='pending'?'확인':'해제',()=>{Store.del('links',v);render();},true);break;}
    case'join':await join();break;
    case'share':await Store.update('profiles',ME,{share:!prof(ME).share});render();break;
    case'savename':{const n=(S.drafts.myname||'').trim();if(!n){toast('이름을 입력하세요.');break;}await Store.update('profiles',ME,{name:n});delete S.drafts.myname;toast('이름을 바꿨어요.');render();break;}
    case'adddrill':S.dd[w].push({id:'d'+uid(),name:'',target:''});render();break;
    case'deldrill':S.dd[w].splice(+v,1);render();break;
    case'savedrills':{
      const list=S.dd[w].filter(d=>d.name.trim()).map(d=>({id:d.id,name:d.name.trim(),target:(d.target||'').trim(),desc:d.desc||''}));
      await Store.set('drills',w==='me'?ME:'c_'+ME,{list,updatedAt:Date.now()});delete S.dd[w];toast('연습 항목을 저장했어요.');render();break;}
  }
});
document.addEventListener('input',e=>{
  const el=e.target,f=el.dataset&&el.dataset.field;if(!f)return;
  const v=el.value;
  if(f==='memo')updateLog(ME,S.date,{memo:v},700);
  else if(f==='r-course')S.round.course=v;
  else if(f==='m-name')S.round.match.name=v;
  else if(f==='m-rank')S.round.match.rank=v.replace(/[^0-9]/g,'');
  else if(f==='m-field')S.round.match.field=v.replace(/[^0-9]/g,'');
  else if(f==='l-content')S.lesson.content=v;
  else if(f==='l-hw')S.lesson.homework=v;
  else if(f==='l-date'&&v)S.lesson.date=v;
  else if(f==='l-cname')S.lesson.coachName=v;
  else if(f==='ag-gname')S.ag.gname=v;
  else if(f==='ag-gphone')S.ag.gphone=v;
  else if(f==='mfile')return;
  else if(f==='r-date'&&v)S.round.date=v;
  else if(f==='r-memo')S.round.memo=v;
  else if(f==='h-note')S.round.holes[S.hole].note=v;
  else if(f==='fb')S.drafts[el.dataset.ref]=v;
  else if(f==='dn')S.dd[el.dataset.w][+el.dataset.i].name=v;
  else if(f==='dt')S.dd[el.dataset.w][+el.dataset.i].target=v;
  else S.drafts[f]=v;
  if(['ag-gname','ag-gphone'].includes(f)){const b=document.querySelector('.onb .go');if(b)b.classList.toggle('ready',USER?agOk():authReady());}
  if(['name','email','pw'].includes(f)){const b=document.querySelector('.onb .go');if(b){
    if(!USER)b.classList.toggle('ready',authReady());
    else b.classList.toggle('ready',!!v.trim());}}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.field==='mfile'){const f=el.files&&el.files[0];el.value='';if(f)addMedia(f);return;}if(el.dataset&&el.dataset.field==='l-date'&&el.value&&S.lesson)S.lesson.date=el.value;if(el.dataset&&el.dataset.field==='r-date'&&el.value&&S.round)S.round.date=el.value;});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('div[role=button][data-act]')){e.preventDefault();e.target.click();return;}
  if(e.key==='Enter'&&!USER&&e.target.closest&&e.target.closest('.onb')){const b=document.querySelector('[data-act=auth]');if(b)b.click();return;}
  if(e.key==='Escape'&&S.viewer){S.viewer=null;render();return;}
  if(e.key==='Escape'&&S.dlg){S.dlg=null;render();}
});
window.addEventListener('pagehide',flushLogs);

/* ---------- boot ---------- */
async function boot(){
  render();
  try{
    const j=await API.req('/me');
    USER=j.user;ME=j.me;S.admin=!!j.admin;
    await Store.load();
  }catch(e){
    if(e.status!==401)toast(e.message||'서버에 연결하지 못했어요.');
    USER=null;
  }
  S.loading=false;render();
  setInterval(()=>{if(USER&&document.visibilityState==='visible')Store.load().catch(()=>{});},20000);
  document.addEventListener('visibilitychange',()=>{if(USER&&document.visibilityState==='visible')Store.load().catch(()=>{});});
}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}
(function(){
  const sp=document.getElementById('splash');if(!sp)return;
  let done=false;
  const hide=()=>{if(done)return;done=true;sp.classList.add('out');setTimeout(()=>sp.remove(),600);};
  sp.addEventListener('click',hide);
  sp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hide();}});
  setTimeout(hide,5000);
})();
})();
</script>

</body></html>
